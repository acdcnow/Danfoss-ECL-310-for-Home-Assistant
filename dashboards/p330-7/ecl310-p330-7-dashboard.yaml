                  - "$fn ({ hass }) => Math.max(parseFloat(hass.states['sensor.ecl_1_heating_circuit_1_limit_flow_min'].state), Math.min(parseFloat(hass.states['sensor.ecl_1_heating_circuit_1_curve_minus_15degc'].state), parseFloat(hass.states['sensor.ecl_1_heating_circuit_1_limit_flow_max'].state)))"
