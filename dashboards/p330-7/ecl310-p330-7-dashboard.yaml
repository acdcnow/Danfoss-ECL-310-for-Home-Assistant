          - type: "markdown"
            content: "{% set c = 'sensor.ecl_1_heating_circuit_1' %}{% set xs = [-30, -15, -5, 0, 5, 15] %}{% set ks = ['minus_30degc', 'minus_15degc', 'minus_5degc', '0degc', 'plus_5degc', 'plus_15degc'] %}{% set t = states('sensor.ecl_1_sensors_temp_outdoor_s1') | float(none) %}{% set vmin = states(c ~ '_limit_flow_min') | float(none) %}{% set vmax = states(c ~ '_limit_flow_max') | float(none) %}{% set ns = namespace(v=none) %}{% if t is not none %}{% for i in range(5) %}{% set a = states(c ~ '_curve_' ~ ks[i]) | float(none) %}{% set b = states(c ~ '_curve_' ~ ks[i+1]) | float(none) %}{% if a is not none and b is not none and (xs[i] <= t <= xs[i+1]) %}{% set ns.v = a + (b - a) * (t - xs[i]) / (xs[i+1] - xs[i]) %}{% endif %}{% endfor %}{% if ns.v is none %}{% set ns.v = states(c ~ '_curve_' ~ (ks[0] if t < -30 else ks[5])) | float(none) %}{% endif %}{% endif %}**Heizkreis 1 · Steigung {{ states(c ~ '_curve_slope') }}**{% if ns.v is not none %}\n\nAußen {{ t | round(1) }} °C → Kurve {{ [[ns.v, vmin] | max, vmax] | min | round(1) }} °C{% if vmax is not none and ns.v > vmax %} (begrenzt auf {{ vmax | round(0) | int }} °C){% endif %}{% endif %}\n\nRegler-Soll {{ states(c ~ '_temp_flow_target') | float(0) | round(1) }} °C · Ist {{ states(c ~ '_temp_flow_s4') | float(0) | round(1) }} °C"
          - type: "markdown"
