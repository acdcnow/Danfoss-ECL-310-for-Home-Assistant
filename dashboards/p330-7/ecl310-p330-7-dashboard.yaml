# =============================================================================
#  Danfoss ECL 310 - application P330.7 dashboard (sections view, HA 2026.11)
# -----------------------------------------------------------------------------
#  Needs : the danfoss_ecl310 integration with application "P330.7"
#          (master circuit + heating circuit 1 + heating circuit 2, M-Bus meters)
#          Plotly Graph Card (HACS: dbuezas/lovelace-plotly-graph-card) for the
#          heating curves
#          Plotly Graph Card also draws the history graphs (6-minute moving average)
#          dashboards/p330-7/ecl310-p330-7-helpers.yaml (expert switch + two
#          template sensors used by the Hydraulik view)
#  Expert switch: input_boolean.expert_mode (badge in the first section)
#          off = circuits, meters / on = + heating curves, parameters, system
#  Entity ids assume the device name "ECL 1" (sensor.ecl_1_...). If yours is
#  named differently, replace every "ecl_1" with your own slug.
#  Install: dashboard -> edit -> raw configuration editor -> paste -> save.
# =============================================================================
title: "ECL 310"
views:
  - type: "sections"
    path: "ecl310"
    title: "ECL 310"
    icon: "mdi:heating-coil"
    max_columns: 4
    sections:
      - type: "grid"
        cards:
          - type: "heading"
            heading_style: "title"
            heading: "Führungsregelkreis"
            icon: "mdi:transmission-tower"
            badges:
              - type: "entity"
                entity: "input_boolean.expert_mode"
                show_state: true
                show_name: true
                icon: "mdi:account-hard-hat"
                name: "Expertenansicht"
                tap_action:
                  action: "toggle"
          - type: "tile"
            entity: "sensor.ecl_1_sensors_temp_outdoor_s1"
            name: "Außentemperatur"
            vertical: false
          - type: "tile"
            entity: "sensor.ecl_1_master_circuit_temp_flow_s3"
            name: "Vorlauf"
            vertical: false
          - type: "tile"
            entity: "sensor.ecl_1_master_circuit_temp_return_s5"
            name: "Rücklauf"
            vertical: false
          - type: "tile"
            entity: "sensor.ecl_1_master_circuit_mode_pump_p1"
            name: "Pumpe P1"
            vertical: false
          - type: "tile"
            entity: "sensor.ecl_1_master_circuit_m1_movement"
            name: "Ventil M1"
            vertical: false
          - type: "custom:plotly-graph"
            hours_to_show: 24
            refresh_interval: 60
            config:
              displayModeBar: false
              displaylogo: false
              scrollZoom: false
              doubleClick: "reset"
            layout:
              height: 270
              margin:
                l: 44
                r: 12
                t: 10
                b: 72
              showlegend: true
              legend:
                orientation: "h"
                x: 0
                y: -0.38
              paper_bgcolor: "rgba(0,0,0,0)"
              plot_bgcolor: "rgba(0,0,0,0)"
              yaxis:
                ticksuffix: "°"
                gridcolor: "rgba(127,127,127,0.18)"
              xaxis:
                gridcolor: "rgba(127,127,127,0.18)"
              dragmode: "zoom"
            entities:
              - entity: "sensor.ecl_1_master_circuit_temp_flow_s3"
                name: "Vorlauf (roh)"
                showlegend: false
                line:
                  width: 1
                  color: "rgba(229,57,53,0.35)"
              - entity: "sensor.ecl_1_master_circuit_temp_flow_s3"
                name: "Vorlauf (Ø 6 min)"
                line:
                  width: 3
                  color: "rgb(229,57,53)"
                  shape: "spline"
                  smoothing: 0.6
                filters:
                  - resample: "1m"
                  - sliding_window_moving_average:
                      window_size: 6
                      extended: true
                      centered: true
              - entity: "sensor.ecl_1_master_circuit_temp_return_s5"
