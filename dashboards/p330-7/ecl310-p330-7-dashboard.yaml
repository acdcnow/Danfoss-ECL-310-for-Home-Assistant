                  - 95
                fixedrange: true
                zeroline: false
                gridcolor: "rgba(127,127,127,0.18)"
            entities:
              - entity: ""
                name: "Heizkurve (begrenzt)"
                mode: "lines+markers+text"
                text:
                  - "-30°"
                  - "-15°"
                  - "-5°"
                  - "0°"
                  - "+5°"
                  - "+15°"
                textposition: "top center"
                textfont:
                  size: 10
                  color: "#e74c3c"
                line:
