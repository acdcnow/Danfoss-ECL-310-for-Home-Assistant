# =============================================================================
#  Danfoss ECL 310 - Home Assistant package
#  The single helper dashboards/ecl310-dashboard.yaml needs.
# -----------------------------------------------------------------------------
#  Install
#  -------
#  1) copy this file to   <config>/packages/ecl310.yaml
#  2) enable packages once in configuration.yaml:
#
#         homeassistant:
#           packages: !include_dir_named packages
#
#  3) Developer Tools -> YAML -> check configuration -> restart Home Assistant
#
#  Why is a helper needed at all?
#  ------------------------------
#  No integration can create an input_boolean, and Lovelace cannot switch a view
#  on something it cannot see. input_boolean.expert_mode is that switch:
#
#      off  ->  standard view
#      on   ->  expert view   (adds heating curve, system parameters, diagnostics)
#
#  Everything else the dashboard shows comes straight from the integration, so
#  there are deliberately no template sensors here: a missing template could
#  only ever show up as an "unknown" entity on the dashboard.
# =============================================================================

# -----------------------------------------------------------------------------
#  View switch
#  (deliberately without "initial:" so the state is restored after a restart)
# -----------------------------------------------------------------------------
input_boolean:
  expert_mode:
    name: Heizung Expertenmodus
    icon: mdi:account-hard-hat
